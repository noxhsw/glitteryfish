<body>

<p>text</p>
<p>more text</p>
<p>so much text</p>

<!-- block elements will take up 100% of the width of their container and stack vertically on top of one another -->

<div class="block">BLOCK</div>
<div class="block">BLOCK</div>
<div class="block">BLOCK</div>
<div class="block"></div>

<br>

<span class="inline">inline</span>
<span class="inline">inline</span>
<span class="inline">inline</span>

<!-- block (main element and shape) > inline/spans (details) inline elements only take up as much space as their content requires and they will rest horizontally next to one another if they have spcace to do so -->

<br>
<br>

<span class="inline-block">INLINE-BLOCK</span>
<span class="inline-block">INLINE-BLOCK</span>
<span class="inline-block">INLINE-BLOCK</span>

<br>
<br>

<div class="content-box">i am content and i am in a box</div>


<div class="border-box">i'm not like other girls i am different in regards to my size properties</div>

<br>
